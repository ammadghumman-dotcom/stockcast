[project]
name = "stockcast-api"
version = "0.7.0"
description = "Stockcast API — AI demand forecasting and raw-material planning for ecommerce brands"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "cryptography>=43.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "statsforecast>=1.7",
    "holidays>=0.60",
    "fpdf2>=2.8.9",
    "email-validator>=2.2",
    "pyjwt[crypto]>=2.9",
    "slowapi>=0.1.9",
    "limits[redis]>=3.13",
    "stripe>=11.0",
    "rapidfuzz>=3.14.6",
    "sentry-sdk[celery,fastapi,httpx,sqlalchemy]>=2.71.0",
    "python-json-logger>=4.2.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-celery>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "boto3>=1.43.108",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "vcrpy>=6.0",
    "pytest-recording>=0.13",
    "pytest-timeout>=2.3",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 300
timeout_method = "thread"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true
plugins = ["pydantic.mypy"]
