# CI override: production images, no bind mounts, header auth, inline Celery.
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
services:
  api:
    build: { context: ./apps/api, target: prod }
    command: sh -c "uv run --no-dev alembic upgrade head && uv run --no-dev python -m scripts.seed && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: []
    environment:
      ENV: ci
      DATABASE_URL: postgresql+psycopg://stockcast:stockcast@postgres:5432/stockcast
      CELERY_TASK_ALWAYS_EAGER: "true"
      RATE_LIMIT_STORAGE: memory://
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: text
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  worker:
    profiles: ["never"]   # eager mode in CI: no separate worker
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    command: node apps/web/server.js
    volumes: []
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/onboarding"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
