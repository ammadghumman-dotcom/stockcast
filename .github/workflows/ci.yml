name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install Chronos (CPU torch)
        run: uv pip install -r requirements-chronos.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Cache Chronos model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-bolt-small-v1
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations up/down/up + models match schema
        run: |
          uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
          uv run alembic check
      - name: Tests (prints seed-org backtest WAPE)
        run: |
          set -o pipefail
          uv run pytest -q -s -rfE --tb=short --durations=15 --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80 2>&1 | tee pytest.log
          { echo "### Forecast backtest"; grep -E "\[backtest" pytest.log || echo "(no backtest line)"; echo; echo "### Coverage"; grep -E "^TOTAL" pytest.log || true; echo; echo "### Slowest tests"; echo '```'; sed -n '/slowest 15 durations/,/^=\{10\}/p' pytest.log | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post test digest on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ job.status }}"
          { echo "**API tests: ${status}** (run ${{ github.run_id }})"; echo; echo '```'; grep -E "\[backtest|passed|failed|^TOTAL" pytest.log | tail -6; echo; sed -n '/slowest 15 durations/,/^=\{10\}/p' pytest.log | head -20; if [ "$status" != "success" ]; then echo; grep -nE "^(FAILED|ERROR) " pytest.log | head -40; echo; tail -n 120 pytest.log; fi; echo '```'; } > digest.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file digest.md
      - name: Seed runs
        run: uv run alembic upgrade head && uv run python -m scripts.seed

  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @stockcast/web build

  e2e:
    name: E2E — Playwright against docker compose
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production images (layer cache in GHA)
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml,docker-compose.ci.yml
          targets: api,web
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
      - name: Start the stack (migrate + seed happen in the api entrypoint)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --wait --wait-timeout 300 postgres redis api web
          curl -fsS localhost:8000/health/ready && curl -fsS -o /dev/null localhost:3000/onboarding
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stockcast/web exec playwright install --with-deps chromium
      - name: Playwright
        env:
          API_URL: http://localhost:8000
        run: pnpm --filter @stockcast/web exec playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color api web > /tmp/compose.log 2>&1 || true
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/compose.log
