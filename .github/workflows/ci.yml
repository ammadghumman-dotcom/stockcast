name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install Chronos (CPU torch)
        run: uv pip install -r requirements-chronos.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Cache Chronos model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-bolt-small-v1
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations up/down/up + models match schema
        run: |
          uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
          uv run alembic check
      - name: Tests (prints seed-org backtest WAPE)
        run: |
          set -o pipefail
          uv run pytest -q -s 2>&1 | tee pytest.log
          { echo "### Forecast backtest"; grep -E "\[backtest\]" pytest.log || echo "(no backtest line)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Seed runs
        run: uv run alembic upgrade head && uv run python -m scripts.seed

  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @stockcast/web build
