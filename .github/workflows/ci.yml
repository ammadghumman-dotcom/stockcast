name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install Chronos (CPU torch)
        run: uv pip install -r requirements-chronos.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Cache Chronos model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-bolt-small-v1
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations up/down/up + models match schema
        run: |
          uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
          uv run alembic check
      - name: Tests (prints seed-org backtest WAPE)
        run: |
          set -o pipefail
          uv run pytest -q -s -rfE --tb=short --durations=15 2>&1 | tee pytest.log
          { echo "### Forecast backtest"; grep -E "\[backtest" pytest.log || echo "(no backtest line)"; echo; echo "### Slowest tests"; echo '```'; sed -n '/slowest 15 durations/,/^=\{10\}/p' pytest.log | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post test digest on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ job.status }}"
          { echo "**API tests: ${status}** (run ${{ github.run_id }})"; echo; echo '```'; grep -E "\[backtest|passed|failed" pytest.log | tail -5; echo; sed -n '/slowest 15 durations/,/^=\{10\}/p' pytest.log | head -20; if [ "$status" != "success" ]; then echo; grep -nE "^(FAILED|ERROR) " pytest.log | head -40; echo; tail -n 120 pytest.log; fi; echo '```'; } > digest.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file digest.md
      - name: Seed runs
        run: uv run alembic upgrade head && uv run python -m scripts.seed

  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @stockcast/web build

  e2e:
    name: E2E — Playwright (onboarding → dashboard → PO)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockcast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockcast
      CELERY_TASK_ALWAYS_EAGER: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          (cd apps/api && uv sync)
          pnpm install --frozen-lockfile
          pnpm --filter @stockcast/web exec playwright install --with-deps chromium
      - name: Migrate + seed, start API and web
        run: |
          (cd apps/api && uv run alembic upgrade head && uv run python -m scripts.seed)
          (cd apps/api && nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          pnpm --filter @stockcast/web build
          (cd apps/web && nohup pnpm start -p 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/health >/dev/null && curl -sf localhost:3000/onboarding >/dev/null && break; sleep 2; done
          curl -sf localhost:8000/health && curl -sf -o /dev/null localhost:3000/onboarding
      - name: Playwright
        run: pnpm --filter @stockcast/web exec playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/api.log
            /tmp/web.log
